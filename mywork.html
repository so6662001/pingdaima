    '<button class="btn btn-sm btn-primary btn-block mt8" data-toast="认领成功，任务已进入你的看板">认领</button></div>';
}).join('') + '<div class="muted fz11 tc">本迭代还可承接约 5 点</div>';

  [['需求进度与阶段提醒', 1], ['待认领任务推送', 1], ['指派给我的缺陷', 1], ['待我评审的 PR', 1], ['迭代日报', 0]]

        '<span class="switch ' + (r[1] ? 'on' : '') + '"></span></div>';
    }).join('') +
  '<a class="btn btn-sm btn-block mt8" href="notify.html">推送设置</a>';

document.getElementById('follows').innerHTML = [
  ['bulb', 'req', 'REQ-2041 智能路由能力', '状态：评审中'],
  ['kanban', 'task', 'PRJ-018 支付网关 3.0', '进度 68%'],
  ['bug', 'bug', 'BUG-771 对账任务超时', '处理中'],
  ['rocket', 'epic', 'V3.0 版本发布', '就绪度 68%'],
